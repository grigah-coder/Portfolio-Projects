<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculatrice web moderne : opérations de base, parenthèses, pourcentages, historique et prise en charge du clavier."
    />
    <meta name="theme-color" content="#0d0f14" />
    <title>Calculatrice</title>
    <link rel="stylesheet" href="Calculatrice.css" />
  </head>

  <body>
    <main class="app" aria-label="Calculatrice">
      <section class="calculator" aria-label="Clavier de la calculatrice">
        <h1 class="visually-hidden">Calculatrice</h1>
        <div class="screen">
          <p class="screen__expression" id="expression" aria-hidden="true"></p>
          <output
            class="screen__result"
            id="result"
            aria-live="polite"
            aria-atomic="true"
          >
            0
          </output>
          <p class="screen__hint" id="hint">Tapez une opération ou utilisez le clavier</p>
        </div>

        <div class="keypad" id="keypad">
          <button type="button" class="key key--function" data-action="clear" aria-label="Tout effacer">C</button>
          <button type="button" class="key key--function" data-action="backspace" aria-label="Effacer le dernier caractère">⌫</button>
          <button type="button" class="key key--function" data-value="(" aria-label="Parenthèse ouvrante">(</button>
          <button type="button" class="key key--function" data-value=")" aria-label="Parenthèse fermante">)</button>

          <button type="button" class="key" data-value="7">7</button>
          <button type="button" class="key" data-value="8">8</button>
          <button type="button" class="key" data-value="9">9</button>
          <button type="button" class="key key--operator" data-value="/" aria-label="Diviser">÷</button>

          <button type="button" class="key" data-value="4">4</button>
          <button type="button" class="key" data-value="5">5</button>
          <button type="button" class="key" data-value="6">6</button>
          <button type="button" class="key key--operator" data-value="*" aria-label="Multiplier">×</button>

          <button type="button" class="key" data-value="1">1</button>
          <button type="button" class="key" data-value="2">2</button>
          <button type="button" class="key" data-value="3">3</button>
          <button type="button" class="key key--operator" data-value="-" aria-label="Soustraire">−</button>

          <button type="button" class="key key--function" data-value="%" aria-label="Pourcentage">%</button>
          <button type="button" class="key" data-value="0">0</button>
          <button type="button" class="key" data-value="." aria-label="Virgule décimale">.</button>
          <button type="button" class="key key--operator" data-value="+" aria-label="Additionner">+</button>

          <button type="button" class="key key--equals" data-action="equals" aria-label="Calculer le résultat">=</button>
        </div>
      </section>

      <aside class="history" aria-labelledby="history-title">
        <div class="history__head">
          <h2 id="history-title">Historique</h2>
          <button type="button" class="history__clear" id="clear-history">
            Effacer
          </button>
        </div>
        <p class="history__empty" id="history-empty">
          Vos calculs apparaîtront ici.
        </p>
        <ol class="history__list" id="history-list"></ol>
      </aside>
    </main>

    <script src="Calculatrice.js"></script>
  </body>
</html>
